[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "gemqc-pilot"
version = "1.1.0"
description = "gemQC-pilot - reduced gemQC for new F12 methods (SCF, MP2, MP2-F12, F12XG pilot)"
authors = [{name = "A. Koehn"}]
license = "BSD-3-Clause"
license-files = ["LICENSE", "lib/basis/README.md"]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pyyaml", "h5py"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx", "myst-parser", "furo"]

[project.scripts]
gemqc = "gemqc.__main__:main"

[tool.scikit-build]
wheel.packages = ["python/gemqc"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# rebuild C++ on import for editable installs (needs --no-build-isolation)
editable.rebuild = true
editable.verbose = false
